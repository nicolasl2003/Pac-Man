[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "manage-screen"
version = "0.1.0"
description = "Gestion des écrans et du rendu pour PacMan"
requires-python = ">=3.10"
dependencies = [
    "pygame>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["manage_screen"]