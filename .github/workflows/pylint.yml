name: Pylint

on: [push, pull_request]

jobs:
  build:
    name: Linting
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential make
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install uv
    - parallel:
      - name: Flake8
        run: |
          uv run python3 -m flake8 src
      - name: Mypy
        run: |
          uv run python3 -m mypy src
      - name: Analysing the code with linting
        id: lint
        run: |
          make lint
      - name: Analysing the code with linting strict
        run: |
          make lint-strict
  import:
    name: Main lib import
    if: always()
    runs-on: ubuntu-slim
    container:
      image: ghcr.io/astral-sh/uv:python3.14-trixie-slim
    steps:
      - name: Downloading dependencies
        run: |
          uv install
      - parallel:
        - name: Importing config
          run: |
            uv run python3 -c "import src.config"
        - name: Running config
          run: |
            echo "{'test':1, 'lives': 5}" > cfg.json
            uv run python3 -c 'import src.config as cfg; cfg.ConfigWrapper(); import sys; cfg.Config.load_from_path("./cfg.json"); sys.exit(0 if cfg.Config.lives == 5 else 1)'
        - name: Importing src package
          run: |
            uv run python3 -c "import src"
        - name: Running src package
          run: |
            uv run python3 -m src
    
