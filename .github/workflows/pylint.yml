name: Pylint

on: [push, pull_request]

jobs:
  build:
    timeout-minutes: 2
    name: Linting
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential make
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install uv
    - name: Install project dependencies
      run: |
        uv sync
    - parallel:
      - name: Flake8
        run: |
          uv run python3 -m flake8 src
      - name: Mypy
        run: |
          uv run python3 -m mypy src
      - name: Analysing the code with linting
        id: lint
        run: |
          make lint
      - name: Analysing the code with linting strict
        run: |
          make lint-strict
  import:
    timeout-minutes: 2
    name: Main lib import
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Create Dummy ALSA Config
        run: |
          mkdir -p ~/.config/alsa
          echo 'pcm.!default { type plug slave.pcm "null" }' > ~/.config/alsa/asoundrc
          echo 'ctl.!default { type hw card 0 }' >> ~/.config/alsa/asoundrc
      - name: Downloading dependencies
        run: |
          uv sync
      - parallel:
        - name: Importing config
          run: |
            uv run python3 -c "import src.config"
        - name: Running config
          run: |
            echo '{"test":1, "lives": 5}' > cfg.json
            uv run python3 -c 'import src.config as cfg; cfg.ConfigWrapper(); import sys; cfg.Config.load_from_file("cfg.json"); sys.exit(0 if cfg.Config.lives == 5 else 1)'
        - name: Importing src package
          run: |
            uv run python3 -c "import src"
        - name: Running src package
          env:
            PYTHONUNBUFFERED: "1"
          run: |
            uv run python3 -m src &
            sleep 30
            pkill -INT -f 'python3 \-m src'
            wait $! || true

